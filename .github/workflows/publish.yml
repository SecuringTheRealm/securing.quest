# File: .github/workflows/publish.yml
name: gh-pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - "tsconfig.json"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "0 5 * * 1" # Rebuild so new YouTube videos appear

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  schedule_gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.calculate.outputs.run }}

    steps:
      - name: Calculate fortnight schedule 🗓️
        id: calculate
        run: |
          anchor_date="2026-11-30"
          today_date=$(date -u +%F)
          anchor_epoch=$(date -u -d "$anchor_date" +%s)
          today_epoch=$(date -u -d "$today_date" +%s)
          elapsed_days=$(( (today_epoch - anchor_epoch) / 86400 ))

          if (( elapsed_days >= 0 && elapsed_days % 14 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: always() && (github.event_name != 'schedule' || needs.schedule_gate.outputs.run == 'true')
    runs-on: ubuntu-latest
    needs: schedule_gate

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Bun 🥟
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Cache bun dependencies ⚡
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies 🔧
        run: bun install --frozen-lockfile

      - name: Lint and unit tests 🔍
        run: bun run lint && bun test

      - name: Setup Pages ⚙️
        uses: actions/configure-pages@v4

      - name: Build with Astro 🏗️
        run: bun run build

      - name: Send webmentions
        if: github.event_name == 'push'
        run: bun run send:webmentions

      - name: Commit sent webmentions tracking
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sent-webmentions.json
          git diff --staged --quiet || git commit -m "chore: update sent webmentions tracking [skip ci]"
          git push

      - name: Upload artifact 📡
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: [schedule_gate, build]
    if: always() && needs.build.result == 'success' && (github.event_name != 'schedule' || needs.schedule_gate.outputs.run == 'true')

    steps:
      - name: Publish to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
