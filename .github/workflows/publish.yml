# File: .github/workflows/publish.yml
name: publish-to-github-pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - "tsconfig.json"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "0 5 * * 1,4" # Rebuild so new YouTube videos appear

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Bun 🥟
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies ⚡
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies 🔧
        run: bun install --frozen-lockfile

      - name: Lint and unit tests 🔍
        run: bun run lint && bun test

      - name: Setup Pages ⚙️
        uses: actions/configure-pages@v4

      - name: Build with Astro 🏗️
        run: bun run build

      - name: Send webmentions
        if: github.event_name == 'push'
        run: bun run send:webmentions

      - name: Commit sent webmentions tracking
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sent-webmentions.json
          git diff --staged --quiet || git commit -m "chore: update sent webmentions tracking [skip ci]"
          git push

      - name: Upload artifact 📡
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
