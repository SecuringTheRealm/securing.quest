# File: .github/workflows/publish.yml
name: publish-to-github-pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - "tsconfig.json"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "0 5 * * 1" # Rebuild so new YouTube videos appear

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  schedule_gate:
    permissions:
      contents: read
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.calculate.outputs.run }}

    steps:
      - name: Calculate fortnight schedule 🗓️
        id: calculate
        run: |
          anchor_date="2026-11-30"
          today_date=$(date -u +%F)
          anchor_epoch=$(date -u -d "$anchor_date" +%s)
          today_epoch=$(date -u -d "$today_date" +%s)
          elapsed_days=$(( (today_epoch - anchor_epoch) / 86400 ))

          if (( elapsed_days >= 0 && elapsed_days % 14 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: always() && (github.event_name != 'schedule' || needs.schedule_gate.outputs.run == 'true')
    runs-on: ubuntu-latest
    needs: schedule_gate

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun 🥟
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - name: Cache bun dependencies ⚡
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies 🔧
        run: bun install --frozen-lockfile

      - name: Lint and unit tests 🔍
        run: bun run lint && bun test

      - name: Setup Pages ⚙️
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Astro 🏗️
        run: bun run build

      - name: Attest build artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./dist/**

      - name: Send webmentions
        if: github.event_name == 'push'
        run: bun run send:webmentions

      - name: Commit sent webmentions tracking
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sent-webmentions.json
          git diff --staged --quiet || git commit -m "chore: update sent webmentions tracking [skip ci]"
          git push

      - name: Upload artifact 📡
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: [schedule_gate, build]
    if: always() && needs.build.result == 'success' && (github.event_name != 'schedule' || needs.schedule_gate.outputs.run == 'true')

    steps:
      - name: Publish to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify live site
        run: |
          for path in / /talks/ /shorts/ /shorts/rss.xml; do
            curl --fail --retry 12 --retry-delay 5 --retry-all-errors --silent --show-error \
              --output /dev/null "https://securing.quest${path}"
          done
