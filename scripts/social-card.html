<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<title>Securing the Realm social card</title>
<link rel="stylesheet" href="../src/styles/tokens.css">
<style>
  /* Export the artboard at 1200 × 630 CSS pixels and device scale 1. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    display: grid;
    grid-template-columns: 410px 1fr;
    gap: var(--space-8);
    align-content: center;
    align-items: center;
    padding: var(--space-12);
    background: var(--colour-teal-dark);
    color: var(--colour-parchment);
    font-family: var(--font-body);
    position: relative;
  }
  body::before, body::after {
    content: '';
    position: absolute;
    inset-inline: var(--space-8);
    height: var(--space-3);
    background: repeating-linear-gradient(90deg, var(--colour-gold) 0 12px, transparent 12px 20px);
  }
  body::before { top: var(--space-8); }
  body::after { bottom: var(--space-8); }
  .shield {
    width: 410px;
    height: 384px;
    background: url('../public/str-logo.png') center top / 560px auto no-repeat;
  }
  h1 { margin: 0; color: var(--colour-gold-light); font-size: 118px; line-height: .94; }
  p { margin: var(--space-8) 0 0; font-size: 52px; line-height: 1.12; }
</style>
<div class="shield" aria-hidden="true"></div>
<main>
  <h1>Securing<br>the Realm</h1>
  <p>AI governance, platforms<br>and cybersecurity</p>
</main>
</html>
